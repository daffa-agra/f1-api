[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-api"
version = "0.1.0"
description = "F1 2026 Data API backend"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "F1 API"}]
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic==1.13.1",
    "fastf1==3.4.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.4.0",
    "apscheduler==3.10.4",
    "python-dotenv==1.0.1",
    "httpx==0.27.0",
    "tenacity==8.2.3",
    "pandas>=2.2.3",
    "pytest==8.2.0",
    "pytest-asyncio==0.23.7",
    "ruff==0.4.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.alembic]
script_location = "alembic"

[tool.alembic.commands]
revision = "alembic revision --autogenerate"
upgrade = "alembic upgrade head"
downgrade = "alembic downgrade -1"
