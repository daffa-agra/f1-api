services:
  - type: web
    name: f1-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: f1-db
          property: connectionString
      - key: PYTHONUNBUFFERED
        value: "1"
